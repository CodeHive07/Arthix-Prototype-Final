services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arthix
      POSTGRES_USER: arthix
      POSTGRES_PASSWORD: arthix-local-only
    ports:
      - "5432:5432"
    volumes:
      - arthix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthix -d arthix"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arthix-minio
      MINIO_ROOT_PASSWORD: arthix-minio-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arthix-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 arthix-minio arthix-minio-local-only && mc mb --ignore-existing local/arthix-documents && mc anonymous set none local/arthix-documents"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me-before-sharing
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/arthix-realm.json:ro

volumes:
  arthix-postgres:
  arthix-minio:
